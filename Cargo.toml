[package]
name = "epma-system-data"
version = "0.1.0"
edition = "2021"
description = "Limpeza de System Data no macOS com interface nativa em Rust"
license = "MIT"

[dependencies]
eframe = "0.29"
walkdir = "2"
trash = "5"
dirs = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
