<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPMA System Data — proposta de layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  const scale = (name, keys) => Object.fromEntries(keys.map(k => [k, v(`${name}-${k}`)]));
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
      colors: {
        card: v('card'),
        slate:   scale('slate',   [50,100,200,300,400,500,600,700,800,900]),
        emerald: scale('emerald', [50,500,700,800]),
        amber:   scale('amber',   [50,500,700]),
        red:     scale('red',     [50,200,300,400,500,600,700,800]),
        blue:    scale('blue',    [50,100,200,400,700,800]),
      },
    } }
  };
</script>
<style>
  /* Tokens. Claro = padrão; .dark redefine os mesmos nomes (tripletos RGB p/ suportar opacidade). */
  :root {
    --bg: #F8FAFC; --ink: #1E293B; --titlebar: #EEF2F6;
    --accent: #2563EB; --accent-hover: #1D4ED8; --accent-text: #2563EB; --accent-soft: #EFF6FF;
    --skel-a: #E2E8F0; --skel-b: #EEF2F6;
    --card: 255 255 255;
    --slate-50: 248 250 252; --slate-100: 241 245 249; --slate-200: 226 232 240; --slate-300: 203 213 225; --slate-400: 148 163 184;
    --slate-500: 100 116 139; --slate-600: 71 85 105; --slate-700: 51 65 85; --slate-800: 30 41 59; --slate-900: 15 23 42;
    --emerald-50: 236 253 245; --emerald-500: 16 185 129; --emerald-700: 4 120 87; --emerald-800: 6 95 70;
    --amber-50: 255 251 235; --amber-500: 245 158 11; --amber-700: 180 83 9;
    --red-50: 254 242 242; --red-200: 254 202 202; --red-300: 252 165 165; --red-400: 248 113 113; --red-500: 239 68 68;
    --red-600: 220 38 38; --red-700: 185 28 28; --red-800: 153 27 27;
    --blue-50: 239 246 255; --blue-100: 219 234 254; --blue-200: 191 219 254; --blue-400: 96 165 250; --blue-700: 29 78 216; --blue-800: 30 64 175;
    color-scheme: light;
  }
  :root.dark {
    --bg: #0A0A0A; --ink: #E5E5E5; --titlebar: #161616;
    --accent: #3B82F6; --accent-hover: #2563EB; --accent-text: #93C5FD; --accent-soft: rgba(59,130,246,.16);
    --skel-a: #1F1F1F; --skel-b: #2B2B2B;
    --card: 18 18 18;
    --slate-50: 24 24 24; --slate-100: 32 32 32; --slate-200: 42 42 42; --slate-300: 64 64 64; --slate-400: 115 115 115;
    --slate-500: 163 163 163; --slate-600: 184 184 184; --slate-700: 212 212 212; --slate-800: 229 229 229; --slate-900: 245 245 245;
    --emerald-50: 6 44 33; --emerald-500: 16 185 129; --emerald-700: 52 211 153; --emerald-800: 110 231 183;
    --amber-50: 48 35 8; --amber-500: 245 158 11; --amber-700: 252 211 77;
    --red-50: 56 20 24; --red-200: 127 29 29; --red-300: 153 27 27; --red-400: 248 113 113; --red-500: 239 68 68;
    --red-600: 220 38 38; --red-700: 252 165 165; --red-800: 254 202 202;
    --blue-50: 14 24 44; --blue-100: 23 37 70; --blue-200: 30 58 120; --blue-400: 96 165 250; --blue-700: 147 197 253; --blue-800: 191 219 254;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  .skel { background: linear-gradient(90deg,var(--skel-a),var(--skel-b),var(--skel-a)); border-radius: 6px; }
  .hover-t { transition: background-color .2s, color .2s, border-color .2s; }
  .dark .i-moon, :root:not(.dark) .i-sun { display: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body class="h-screen overflow-hidden flex flex-col font-sans antialiased text-[13px]">
<div id="app" class="flex flex-col flex-1 min-h-0"></div>

<script>
/* ---------- ícones (Lucide, inline) ---------- */
const P = {
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  drive: '<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  sliders: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  okc: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
  folder: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  sort: '<path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  sparkle: '<path d="M9.94 14.06 4 12l5.94-2.06L12 4l2.06 5.94L20 12l-5.94 2.06L12 20z"/>',
};
const ic = (n, c = 'w-4 h-4', sw = 2) =>
  `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---------- peças ---------- */
const pill = (risk) => risk === 'safe'
  ? `<span class="inline-flex items-center rounded-full bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/20 px-2 py-0.5 text-[11px] font-medium">Seguro</span>`
  : `<span class="inline-flex items-center rounded-full bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20 px-2 py-0.5 text-[11px] font-medium">Revisar</span>`;

const check = (on, dis = false) =>
  `<span class="grid place-items-center w-4 h-4 rounded border ${on ? 'bg-[var(--accent)] border-[var(--accent)] text-white' : 'bg-card border-slate-300'} ${dis ? 'opacity-40' : ''}">${on ? ic('check', 'w-3 h-3', 3) : ''}</span>`;

const btn = {
  primary: (t, extra = '') => `<button class="hover-t inline-flex items-center gap-2 whitespace-nowrap rounded-lg bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white font-semibold px-4 h-9 shadow-sm ${extra}">${t}</button>`,
  primaryOff: (t) => `<button class="inline-flex items-center gap-2 rounded-lg bg-slate-200 text-slate-400 font-semibold px-4 h-9 cursor-not-allowed">${t}</button>`,
  danger: (t) => `<button class="hover-t inline-flex items-center gap-2 whitespace-nowrap rounded-lg bg-red-600 hover:brightness-110 text-white font-semibold px-4 h-9 shadow-sm">${t}</button>`,
  dangerOff: (t) => `<button class="inline-flex items-center gap-2 whitespace-nowrap rounded-lg bg-red-600/30 text-white/60 font-semibold px-4 h-9 cursor-not-allowed">${t}</button>`,
  ghost: (t, extra = '') => `<button class="hover-t inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-card hover:bg-slate-50 text-slate-700 font-medium px-3 h-9 ${extra}">${t}</button>`,
  link: (t) => `<button class="hover-t inline-flex items-center gap-1.5 rounded-md border border-current/30 bg-card/70 hover:bg-card font-medium px-2.5 h-7 text-[12px]">${t}</button>`,
};

const kebab = `<button class="hover-t grid place-items-center w-7 h-7 rounded-md text-slate-400 hover:text-slate-700 hover:bg-slate-100">${ic('more')}</button>`;

/* ---------- dados (do scan real desta máquina) ---------- */
const MAXB = 1154; // MB, maior categoria (para a mini-barra proporcional)
const CATS = {
  caches: { name: 'Caches de apps', desc: '~/Library/Caches · 47 itens', risk: 'safe', size: '767,8 MB', mb: 768, on: true },
  logs:   { name: 'Logs e relatórios de falha', desc: '~/Library/Logs · 7 itens', risk: 'safe', size: '260 KB', mb: 0.3, on: true },
  dev:    { name: 'Caches de ferramentas de desenvolvimento', desc: '~/.cache, ~/.npm, ~/.cargo · 7 itens', risk: 'review', size: '1,2 GB', mb: 1154, on: false },
};
const EMPTY_NAMES = ['Xcode DerivedData', 'Device Support (iOS/watchOS/tvOS)', 'Caches do Simulator', 'Simuladores indisponíveis', 'Snapshots locais do Time Machine', 'Anexos baixados do Mail', 'Xcode Archives', 'Backups de iPhone/iPad'];

/* ---------- linha de categoria ---------- */
function row(c, o = {}) {
  const { loading = false, expanded = false, error = null, dim = false, children = '' } = o;
  const barW = Math.max(2, Math.round((c.mb / MAXB) * 100));
  const size = loading
    ? `<div class="skel h-4 w-16 ml-auto"></div>`
    : c.size
      ? `<div class="flex items-center justify-end gap-3">
           <div class="hidden md:block w-24 h-1.5 rounded-full bg-slate-100"><div class="h-1.5 rounded-full ${c.on ? 'bg-blue-400' : 'bg-slate-300'}" style="width:${barW}%"></div></div>
           <span class="w-[68px] text-right tabular-nums font-semibold">${c.size}</span>
         </div>`
      : `<span class="block text-right text-slate-400">—</span>`;
  return `
  <div class="${error ? 'bg-red-50/60 shadow-[inset_2px_0_0_0_rgb(var(--red-400))]' : ''}">
    <div class="grid grid-cols-[20px_minmax(0,1fr)_auto_28px] items-center gap-x-3 px-4 py-2.5 hover-t hover:bg-slate-50/70 ${dim ? 'opacity-60' : ''}">
      <div>${check(c.on && !error && !loading, !!error || dim || loading)}</div>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-semibold truncate">${c.name}</span>
        </div>
        <div class="hidden md:block text-[12px] mt-0.5 ${error ? 'text-red-700' : 'text-slate-500'} truncate">${error || c.desc}</div>
      </div>
      <div>${size}</div>
      <div class="flex justify-end">${loading ? '' : (expanded ? `<span class="text-slate-500">${ic('down')}</span>` : `<span class="text-slate-400">${ic('right')}</span>`)}</div>
    </div>
    ${children}
  </div>`;
}

function section(title, hint, subtotal, rows) {
  return `
  <section class="rounded-xl border border-slate-200 bg-card shadow-sm">
    <header class="flex items-center justify-between px-4 h-10 bg-slate-50/80 rounded-t-xl border-b border-slate-200">
      <div class="flex items-center gap-2"><h2>${pill(title === 'Seguro' ? 'safe' : 'review')}</h2><span class="text-[12px] text-slate-400">${hint}</span></div>
      <span class="text-[12px] text-slate-500 tabular-nums">${subtotal}</span>
    </header>
    <div class="divide-y divide-slate-100">${rows}</div>
  </section>`;
}

const emptyGroup = (n = 8) => `
  <button class="hover-t w-full flex items-center gap-2 rounded-xl border border-dashed border-slate-300 bg-card/60 hover:bg-card px-4 h-11 text-slate-500">
    ${ic('right')}<span>Nada para limpar ou indisponível</span><span class="rounded-full bg-slate-100 px-2 text-[11px] text-slate-600">${n}</span>
    <span class="ml-auto text-[12px] text-slate-400">${EMPTY_NAMES.slice(0, 3).join(' · ')}…</span>
  </button>`;

/* ---------- cartões de topo ---------- */
function hero({ loading = false, value = '768,0 MB', sub = '2 categorias seguras selecionadas · vão para a Lixeira', done = false } = {}) {
  return `
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 rounded-xl border border-slate-200 bg-card shadow-sm p-5">
      <div class="text-[12px] font-medium text-slate-500">${done ? 'Resultado' : 'Pode ser liberado agora'}</div>
      ${loading
        ? `<div class="skel h-10 w-48 mt-2"></div><div class="skel h-3.5 w-72 mt-3"></div>`
        : `<div class="mt-1 text-[40px] leading-tight font-bold tracking-tight tabular-nums">${value}</div>
           <div class="text-slate-500 mt-0.5">${sub}</div>`}
      <div class="mt-4 grid grid-cols-3 gap-4 pt-4 border-t border-slate-100">
        ${[['Seguro', loading ? null : (done ? '0 B' : '768,0 MB'), 'bg-emerald-500'], ['Revisar', loading ? null : '1,2 GB', 'bg-amber-500'], ['Itens encontrados', loading ? null : (done ? '7' : '61'), 'bg-slate-300']]
          .map(([l, v, d]) => `<div><div class="flex items-center gap-1.5 text-[12px] text-slate-500"><span class="w-1.5 h-1.5 rounded-full ${d}"></span>${l}</div>
             ${v ? `<div class="mt-0.5 font-semibold tabular-nums">${v}</div>` : `<div class="skel h-4 w-14 mt-1.5"></div>`}</div>`).join('')}
      </div>
    </div>
    <div class="rounded-xl border border-slate-200 bg-card shadow-sm p-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-[12px] font-medium text-slate-500">${ic('drive')}Macintosh HD</div>
        <span class="inline-flex items-center gap-1 rounded-full bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 px-2 py-0.5 text-[11px] font-medium">${ic('alert', 'w-3 h-3')}Crítico · 97%</span>
      </div>
      <div class="mt-2 text-2xl font-bold tabular-nums">7,2 GB <span class="text-[13px] font-medium text-slate-500">livres</span></div>
      <div class="mt-3 relative h-2.5 rounded-full bg-slate-100">
        <div class="h-2.5 rounded-full bg-red-500" style="width:97%"></div>
        <span class="absolute top-[-3px] h-[16px] w-px bg-slate-400/70" style="left:90%"></span>
        <span class="absolute top-[-3px] h-[16px] w-px bg-slate-400/70" style="left:95%"></span>
      </div>
      <div class="mt-2 flex justify-between text-[12px] text-slate-500 tabular-nums"><span>237,9 GB usados</span><span>245,1 GB</span></div>
      <p class="mt-3 text-[12px] text-slate-500 leading-snug">Aviso a partir de 90%, crítico a partir de 95% — os mesmos limites do <span class="font-mono text-slate-700">diag</span>.</p>
    </div>
  </div>`;
}

/* ---------- avisos (banners inline, nunca pop-up) ---------- */
const banner = (kind, title, text, actions = '') => {
  const k = {
    error: ['bg-red-50 border-red-200 text-red-800', 'alert'],
    ok: ['bg-emerald-50 border-emerald-200 text-emerald-800', 'okc'],
    info: ['bg-blue-50 border-blue-200 text-blue-800', 'info'],
  }[kind];
  return `<div class="flex items-start gap-3 rounded-xl border ${k[0]} px-4 py-3">
    <span class="mt-0.5">${ic(k[1], 'w-[18px] h-[18px]')}</span>
    <div class="flex-1 min-w-0"><div class="font-semibold">${title}</div><div class="opacity-90 mt-0.5">${text}</div>
      ${actions ? `<div class="mt-2.5 flex gap-2">${actions}</div>` : ''}</div>
    <button class="opacity-60 hover:opacity-100 hover-t">${ic('x')}</button>
  </div>`;
};

/* ---------- moldura ---------- */
function shell({ crumb = 'Limpeza', status, body, bar, overlay = '', active = 'limpeza' }) {
  const nav = (id, icon, label, badge = '') => {
    const on = id === active;
    return `<a class="hover-t flex items-center gap-3 rounded-lg px-3 h-9 ${on ? 'bg-[var(--accent-soft)] text-[var(--accent-text)] font-semibold' : 'text-slate-600 hover:bg-slate-100'}">
      ${ic(icon, 'w-[18px] h-[18px]')}<span class="hidden lg:inline">${label}</span>${badge ? `<span class="hidden lg:inline ml-auto rounded bg-blue-100 text-blue-700 px-1.5 text-[10px] font-semibold">${badge}</span>` : ''}</a>`;
  };
  return `
  <!-- barra de título (janela nativa) -->
  <div class="h-9 shrink-0 flex items-center px-3 border-b border-slate-200 bg-[var(--titlebar)]">
    <div class="flex gap-2"><i class="w-3 h-3 rounded-full bg-[#FF5F57]"></i><i class="w-3 h-3 rounded-full bg-[#FEBC2E]"></i><i class="w-3 h-3 rounded-full bg-[#28C840]"></i></div>
    <div class="flex-1 text-center text-[12px] text-slate-500 font-medium">EPMA System Data</div><div class="w-12"></div>
  </div>
  <div class="flex flex-1 min-h-0 relative">
    <!-- sidebar -->
    <aside class="shrink-0 w-14 lg:w-56 border-r border-slate-200 bg-card flex flex-col py-3 px-2">
      <div class="flex items-center gap-2.5 px-2 h-10 mb-2">
        <span class="grid place-items-center w-8 h-8 rounded-lg bg-[var(--accent)] text-white">${ic('sparkle', 'w-[18px] h-[18px]')}</span>
        <div class="hidden lg:block leading-tight"><div class="font-bold">EPMA</div><div class="text-[11px] text-slate-500">System Data</div></div>
      </div>
      <nav class="space-y-1">
        ${nav('limpeza', 'trash', 'Limpeza')}
        ${nav('discos', 'drive', 'Discos', 'diag')}
        ${nav('historico', 'history', 'Histórico')}
      </nav>
      <div class="mt-auto space-y-1">
        ${nav('ajustes', 'sliders', 'Ajustes')}
        <div class="hidden lg:flex items-center gap-3 px-3 h-9 text-slate-400 hover-t hover:text-slate-600">${ic('panel', 'w-[18px] h-[18px]')}<span>Recolher</span></div>
      </div>
    </aside>
    <!-- principal -->
    <main class="flex-1 min-w-0 flex flex-col">
      <header class="shrink-0 h-14 flex items-center gap-4 px-6 border-b border-slate-200 bg-card/80">
        <nav class="flex items-center gap-1.5 text-[13px] text-slate-500 whitespace-nowrap"><span>EPMA System Data</span>${ic('right', 'w-3.5 h-3.5')}<span class="font-semibold text-slate-800">${crumb}</span></nav>
        <div class="ml-auto flex items-center gap-3">
          <label class="hidden md:flex items-center gap-2 h-9 w-64 rounded-lg border border-slate-200 bg-card px-3 text-slate-400">${ic('search')}<span class="flex-1">Filtrar categorias…</span><kbd class="rounded border border-slate-200 bg-slate-50 px-1.5 text-[11px] text-slate-500">⌘K</kbd></label>
          ${status}
          <button onclick="setLang(lang === 'en' ? 'pt' : 'en')" title="Idioma / Language" class="hover-t inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-slate-200 bg-card text-slate-600 hover:bg-slate-50 font-medium">
            ${ic('globe')}<span data-notr>${lang === 'en' ? 'EN' : 'PT'}</span>
          </button>
