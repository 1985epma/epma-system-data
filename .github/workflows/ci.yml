name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Segunda 06:00 UTC: um aviso de segurança novo aparece sem precisar de commit.
    - cron: "0 6 * * 1"

# Uma execução por branch: um push novo cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissão mínima: o CI só lê o código.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Avisos viram erro: o que passa aqui compila limpo.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      # As ações abaixo estão fixadas por SHA (a tag entre comentários é só para humanos);
      # o Dependabot propõe as atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon, macOS Intel e Linux: os três sistemas que o programa suporta.
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Testes
        run: cargo test --locked

  deny:
    name: Dependências (licenças e avisos de segurança)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          # Rodar de novo toda semana pega avisos novos mesmo sem commit (veja `schedule` abaixo).
          arguments: --all-features
