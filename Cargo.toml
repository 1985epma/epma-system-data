[package]
name = "epma-system-data"
version = "0.1.0"
edition = "2021"
description = "Limpeza de System Data no macOS com interface nativa em Rust"
license = "MIT"

[dependencies]
eframe = "0.29"
walkdir = "2"
trash = "5"
dirs = "7"
libc = "0.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete = "4.6.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"

[profile.release]
lto = true
strip = true
